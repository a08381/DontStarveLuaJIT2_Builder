name: cleanup-glibc228-build-runs

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    name: 清理失败及无产物构建
    runs-on: ubuntu-latest
    steps:
      - name: 清理自身和 glibc 2.28 构建 workflow 的 runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          artifact_runs="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false and .workflow_run.id != null) | .workflow_run.id')"
          declare -A has_artifact=()
          while IFS= read -r run_id; do
            [ -n "$run_id" ] && has_artifact["$run_id"]=1
          done <<< "$artifact_runs"

          deleted=0
          kept=0

          is_newer() {
            local candidate_time="$1"
            local candidate_id="$2"
            local reference_time="$3"
            local reference_id="$4"

            if [[ "$candidate_time" > "$reference_time" ]]; then
              return 0
            fi
            if [[ "$candidate_time" == "$reference_time" ]] && [ "$candidate_id" -gt "$reference_id" ]; then
              return 0
            fi
            return 1
          }

          has_artifact_run() {
            [[ -v "has_artifact[$1]" ]]
          }

          for workflow in cleanup-build-runs.yml build.yml; do
            echo "Processing workflow ${workflow}"
            runs="$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?status=completed&per_page=100&sort=created&direction=desc" \
              --jq '.workflow_runs[] | [.id, .created_at, (.conclusion // "")] | @tsv')"

            latest_failure_id=""
            latest_failure_created=""
            latest_artifact_success_id=""
            latest_artifact_success_created=""

            while IFS=$'\t' read -r run_id created_at conclusion; do
              [ -n "$run_id" ] || continue
              case "$conclusion" in
                failure|timed_out|action_required|startup_failure|stale)
                  if [ -z "$latest_failure_id" ] || is_newer \
                    "$created_at" "$run_id" "$latest_failure_created" "$latest_failure_id"; then
                    latest_failure_id="$run_id"
                    latest_failure_created="$created_at"
                  fi
                  ;;
                success)
                  if has_artifact_run "$run_id" && {
                    [ -z "$latest_artifact_success_id" ] || is_newer \
                      "$created_at" "$run_id" "$latest_artifact_success_created" "$latest_artifact_success_id"
                  }; then
                    latest_artifact_success_id="$run_id"
                    latest_artifact_success_created="$created_at"
                  fi
                  ;;
              esac
            done <<< "$runs"

            keep_latest_failure=false
            if [ -n "$latest_failure_id" ]; then
              if [ -z "$latest_artifact_success_id" ] || ! is_newer \
                "$latest_artifact_success_created" "$latest_artifact_success_id" \
                "$latest_failure_created" "$latest_failure_id"; then
                keep_latest_failure=true
              fi
            fi

            while IFS=$'\t' read -r run_id created_at conclusion; do
              [ -n "$run_id" ] || continue

              if [ "$conclusion" = success ] && has_artifact_run "$run_id"; then
                echo "Kept run ${run_id}: successful run with artifact (created ${created_at})"
                kept=$((kept + 1))
              elif [ "$run_id" = "$latest_failure_id" ] && [ "$keep_latest_failure" = true ]; then
                echo "Kept run ${run_id}: latest failed run without a later successful artifact run (created ${created_at})"
                kept=$((kept + 1))
              else
                if has_artifact_run "$run_id"; then
                  artifact_state=yes
                else
                  artifact_state=no
                fi
                gh api --method DELETE \
                  "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
                echo "Deleted run ${run_id}: conclusion=${conclusion}, artifact=${artifact_state} (created ${created_at})"
                deleted=$((deleted + 1))
              fi
            done <<< "$runs"
          done

          echo "Cleanup complete: deleted=${deleted}, kept=${kept}"
